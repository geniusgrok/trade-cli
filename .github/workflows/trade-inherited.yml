name: Trade 独立完整账户续跑

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '已保存原始证据覆盖的收盘交易日（YYYY-MM-DD）'
        type: string
        required: true
        default: '2026-10-08'

permissions:
  contents: write

concurrency:
  group: trade-a92-inherited-v1
  cancel-in-progress: false

jobs:
  inherited:
    if: github.repository == 'geniusgrok/trade-cli' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      TRADE_SIMULATION_IDENTITY: a92-inherited-v1
      TARGET_DATE: ${{ inputs.target_date }}
      REPORT_PUBLISH_TOKEN: ${{ github.token }}
      STATE_SEAL_KEY: ${{ secrets.TRADE_STATE_KEY }}
    steps:
      - name: 获取运行编排代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 设置绑定的 Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: 安装状态加密依赖
        run: python -m pip install 'cryptography==46.0.0'
      - name: 核验编排、文档和文件
        env:
          TRADE_SIMULATION_IDENTITY: ''
        run: |
          python verify_integrity.py
          python -m unittest discover -s tests -v
          python public_report.py
      - name: 准备固定 a92 生产源码和锁定环境
        id: source
        env:
          TRADE_READ_TOKEN: ${{ secrets.TRADE_SOURCE_TOKEN || secrets.TRADE_READ_TOKEN }}
          SOURCE_TOKEN_VARIABLE_PRESENT: ${{ vars.TRADE_SOURCE_TOKEN != '' || vars.TRADE_READ_TOKEN != '' }}
        run: python bootstrap.py
      - name: 核验并导入独立完整种子和已保存行情
        id: seed
        run: python seed_inherited.py
      - name: 核验独立状态分支和加密密钥
        run: python preflight.py
      - name: 原生续跑并核验完整原件保存
        env:
          TRADE_LOCAL_MARKET_DIR: ${{ runner.temp }}/trade-inherited-evidence/market_data
          TRADE_LOCAL_REGIME_DIR: ${{ runner.temp }}/trade-inherited-evidence/regime_data
        run: python runner.py
      - name: 发布独立中文日报并回读核验
        if: ${{ !cancelled() && steps.source.conclusion == 'success' && steps.seed.conclusion == 'success' }}
        run: python publish_report.py

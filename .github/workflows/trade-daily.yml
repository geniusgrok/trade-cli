name: Trade evidence diagnosis
on:
  workflow_dispatch:
    inputs:
      target_date:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPORT_PUBLISH_TOKEN: ${{ github.token }}
      STATE_SEAL_KEY: ${{ secrets.TRADE_STATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==46.0.0'
      - name: Read saved evidence only
        run: python diagnose_saved.py

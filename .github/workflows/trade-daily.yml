name: Trade Core17 盘后日报

on:
  schedule:
    - cron: '6 9,12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '已完成收盘的交易日（YYYY-MM-DD）；留空使用北京时间当天'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['.github/workflows/trade-daily.yml', '*.py', 'tests/**', 'README.md', 'integrity.json']

permissions:
  contents: write

concurrency:
  group: trade-core17-production
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      TARGET_DATE: ${{ inputs.target_date || '' }}
      REPORT_PUBLISH_TOKEN: ${{ github.token }}
      STATE_SEAL_KEY: ${{ secrets.TRADE_READ_TOKEN }}
    steps:
      - name: 获取运行编排代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 设置 Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装状态加密依赖
        run: python -m pip install 'cryptography==46.0.0'
      - name: 核验文件、运行约束和公开文档
        run: |
          python verify_integrity.py
          python -m unittest discover -s tests -v
          python public_report.py
      - name: 核验状态分支和加密密钥
        run: python preflight.py
      - name: 准备当前生产源码和锁定环境
        id: source
        env:
          TRADE_READ_TOKEN: ${{ secrets.TRADE_READ_TOKEN }}
          SOURCE_TOKEN_VARIABLE_PRESENT: ${{ vars.TRADE_READ_TOKEN != '' }}
        run: python bootstrap.py
      - name: 执行生产策略并核验原件保存
        run: python runner.py
      - name: 发布中文日报并回读核验
        if: ${{ !cancelled() && steps.source.conclusion == 'success' }}
        run: python publish_report.py

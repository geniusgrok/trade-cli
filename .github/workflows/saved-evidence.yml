name: Isolated old checkpoint evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    if: github.repository == 'geniusgrok/trade-cli' && github.ref == 'refs/heads/codex/trade-checkpoint-evidence-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==46.0.0'
      - name: Authenticate immutable old record and emit recipient-sealed evidence
        env:
          REPORT_PUBLISH_TOKEN: ${{ github.token }}
          STATE_SEAL_KEY: ${{ secrets.TRADE_STATE_KEY }}
        run: python read_checkpoint_evidence.py

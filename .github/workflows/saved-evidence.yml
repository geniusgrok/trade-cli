name: Saved evidence diagnosis

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '已保存的交易日结果；不重新取行情或计算策略'
        type: string
        required: true
        default: '2026-10-08'

permissions:
  contents: read

jobs:
  diagnosis:
    if: github.repository == 'geniusgrok/trade-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: geniusgrok/trade
          ref: main
          token: ${{ secrets.TRADE_SOURCE_TOKEN || secrets.TRADE_READ_TOKEN }}
          persist-credentials: false
          path: .runtime/production
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .runtime/production/requirements-lock.txt 'cryptography==46.0.0'
      - name: Read existing encrypted evidence only
        env:
          REPORT_PUBLISH_TOKEN: ${{ github.token }}
          STATE_SEAL_KEY: ${{ secrets.TRADE_STATE_KEY }}
          SAVED_TARGET_DATE: ${{ inputs.target_date }}
        run: python diagnose_saved.py --source .runtime/production --date "$SAVED_TARGET_DATE"
